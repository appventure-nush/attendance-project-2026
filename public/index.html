<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Robotics Club Check-in</title>
<link rel="stylesheet" href="/style.css"></head><body>
<main class="wrap" id="app"><div class="card center sub">Loading…</div></main>
<script>
const app=document.getElementById('app'),$=(h)=>{app.innerHTML=h};
const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||matchMedia('(pointer:coarse)').matches;
const tokenParam=new URLSearchParams(location.search).get('t');
let pasteAttempts=0,hidden=0,stream,scanning=false;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hidden++});
document.addEventListener('contextmenu',e=>e.preventDefault());
const esc=(x)=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hdr=(me)=>`<div class="card row"><div class="av">${esc(me.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div><div><div class="name">${esc(me.name)}</div><div class="sub">${esc(me.email)}</div></div></div>`;
const post=(d)=>fetch('/api/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...d,pasteAttempts,hidden})}).then(async r=>({s:r.status,...await r.json()}));
const MSG={network:'Laptop check-in only works on the school network. Connect to the school Wi-Fi.',wrong:'Those words are wrong or have changed. Type the words on the screen now.',expired:'That QR code expired. Scan the one on screen now.',slow:'Too many attempts. Wait a minute.',signin:'Please sign in again.'};

function done(me,r){stopCam();const t=new Date(r.ts).toLocaleTimeString();
 $(hdr(me)+`<div class="card center"><svg class="tick" viewBox="0 0 120 120"><circle cx="60" cy="60" r="48"/><path d="M38 62l16 16 30-34"/></svg><h1>${r.already?'Already checked in':'You’re checked in'}</h1><p class="sub">${t}</p></div>`)}

function stopCam(){scanning=false;stream&&stream.getTracks().forEach(t=>t.stop())}

async function scanView(me,note){
 $(hdr(me)+`<div class="card"><h1>Scan the screen</h1><p class="sub">${note||'Point your camera at the QR code on the projector.'}</p><div class="cam"><video id="v" playsinline muted autoplay></video><div class="aim"></div></div><div class="err" id="e"></div><button class="btn ghost" id="sw">Type the 3 words instead</button></div>`);
 const e=document.getElementById('e'),say=(m)=>{e.textContent=m};
 document.getElementById('sw').onclick=()=>{stopCam();codeView(me)};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return say('This browser cannot open the camera. Type the words instead.');
 try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}})}
 catch(err){try{stream=await navigator.mediaDevices.getUserMedia({video:true})}
  catch{return say('Camera blocked. Allow camera access in your browser settings, or type the words.')}}
 const track=stream.getVideoTracks()[0];
 try{await track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch{}
 const v=document.getElementById('v');v.srcObject=stream;try{await v.play()}catch{}
 scanning=true;
 if(!window.ZXingWASM){const ok=await new Promise(r=>{const s=document.createElement('script');s.src='/vendor/zxing-reader.js';s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)});
  if(!ok){stopCam();return say('The scanner failed to load. Type the words instead.')}}
 try{await ZXingWASM.prepareZXingModule({overrides:{locateFile:(p,pre)=>p.endsWith('.wasm')?'/vendor/zxing_reader.wasm':pre+p},fireImmediately:true})}
 catch{stopCam();return say('The scanner failed to load. Type the words instead.')}
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 let lastTxt='',lastAt=0,sending=false,frame=0;
 const tokenFrom=(txt)=>{try{return new URL(txt).searchParams.get('t')}catch{const m=String(txt).match(/[?&]t=([\w.]+)/);return m&&m[1]}};
 async function decode(){
  const W=v.videoWidth,H=v.videoHeight;let sx=0,sy=0,sw=W,sh=H;
  if(frame++%2){const side=Math.round(Math.min(W,H)*0.6);sx=(W-side)>>1;sy=(H-side)>>1;sw=sh=side}
  const k=Math.min(1,1280/Math.max(sw,sh));cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
  cx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
  const r=await ZXingWASM.readBarcodes(cx.getImageData(0,0,cv.width,cv.height),{formats:['QRCode'],tryHarder:true,maxNumberOfSymbols:1});
  return r.length&&r[0].isValid?r[0].text:null}
 (async function loop(){
  if(!scanning)return;
  if(!sending&&v.readyState>=2&&v.videoWidth){
   let txt=null;try{txt=await decode()}catch{}
   const t=txt&&tokenFrom(txt);
   if(t&&!(t===lastTxt&&Date.now()-lastAt<5000)){
    lastTxt=t;lastAt=Date.now();sending=true;say('Checking in…');
    try{const r=await post({token:t});if(r.ok){navigator.vibrate&&navigator.vibrate(60);return done(me,r)}
     say(MSG[r.reason]||'Try again.');if(r.reason==='slow'){stopCam();return}}
    catch{say('No connection. Check your internet and try again.')}
    sending=false}
   else if(txt&&!t)say('That is not the attendance QR code.');
  }
  setTimeout(loop,60)})();
}

function codeView(me){
 $(hdr(me)+`<div class="card center"><h1>Type the 3 words</h1><p class="sub">Type the 3 words shown on the screen, in order.</p><form class="words" id="f" autocomplete="off">${[1,2,3].map(i=>`<input id="w${i}" aria-label="Word ${i}" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" maxlength="12" enterkeyhint="${i<3?'next':'go'}">`).join('')}</form><div class="err" id="e"></div><button class="btn" id="go">Check in</button>${mobile?'<button class="btn ghost" id="sw">Scan QR instead</button>':''}</div>`);
 const ins=[1,2,3].map(i=>document.getElementById('w'+i)),e=document.getElementById('e'),go=document.getElementById('go');
 let keys=0,t0=0;ins[0].focus();
 ins.forEach((el,i)=>{
  ['paste','drop','copy','cut'].forEach(ev=>el.addEventListener(ev,x=>{x.preventDefault();pasteAttempts++;e.textContent='Pasting is disabled. Type the words.'}));
  el.addEventListener('beforeinput',x=>{if(/paste|drop|yank/i.test(x.inputType)){x.preventDefault();pasteAttempts++}});
  el.addEventListener('keydown',x=>{
   if(x.key&&x.key.length===1){keys++;if(!t0)t0=Date.now()}
   if(x.key===' '||x.key==='Enter'){x.preventDefault();if(x.key==='Enter'&&i===2)return submit();if(el.value&&i<2)ins[i+1].focus();else if(x.key==='Enter')submit()}
   if(x.key==='Backspace'&&!el.value&&i>0){x.preventDefault();ins[i-1].focus()}});
  el.addEventListener('input',()=>{const v=el.value.toLowerCase().replace(/[^a-z ]/g,'');
   if(v.includes(' ')&&i<2){el.value=v.replace(/ /g,'');ins[i+1].focus()}else el.value=v.replace(/ /g,'')})});
 let busy=false;
 async function submit(){
  if(busy)return;const val=ins.map(x=>x.value.trim());
  if(val.some(v=>!v)){e.textContent='Type all 3 words.';ins[val.findIndex(v=>!v)].focus();return}
  busy=true;go.disabled=true;e.textContent='';
  const chars=val.join('').length,typing=mobile?{}:{keys,chars,ms:t0?Date.now()-t0:0};
  try{const r=await post({words:val.join(' '),...typing});if(r.ok)return done(me,r);
   e.textContent=MSG[r.reason]||'Try again.'}catch{e.textContent='No connection. Check your internet and try again.'}
  ins.forEach(x=>x.value='');keys=0;t0=0;ins[0].focus();busy=false;go.disabled=false}
 go.onclick=submit;document.getElementById('f').onsubmit=x=>{x.preventDefault();submit()};
 const sw=document.getElementById('sw');if(sw)sw.onclick=()=>scanView(me);
}

(async()=>{
 const me=await fetch('/api/me').then(r=>r.json());
 if(!me.email){return $(`<div class="card center"><h1>Robotics Club</h1><p class="sub">Sign in with your school Microsoft account to take attendance.</p><a class="btn" href="/api/auth/login?return=${encodeURIComponent(location.pathname+location.search)}">Sign in with Microsoft</a></div>`)}
 if(tokenParam){const r=await post({token:tokenParam});if(r.ok)return done(me,r);
   if(r.reason==='network')return $(hdr(me)+`<div class="card center"><h1>Wrong network</h1><p class="sub">${MSG.network}</p></div>`);
   return scanView(me,'That link expired. Scan the live QR code on the projector.')}
 mobile?scanView(me):codeView(me);
})();
</script></body></html>
